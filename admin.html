<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Administrador Autentico</title>
</head>

<body>

    <nav class="navbar navbar-dark" style="background-color: #6C6F4E;">
        <div class="container">
            <span class="navbar-brand">Panel de Administración</span>
            <a href="login.html" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
        </div>
    </nav>
    <div class="container my-4">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Agregar o Editar libro</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" id="titulo" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label for="autor" class="form-label">Autor</label>
                            <input type="text" id="autor" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label for="portada" class="form-label">Portada (URL)</label>
                            <input type="url" id="portada" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select id="categoria" class="form-select">
                                <option value="" selected disabled>Seleccionar categoría</option>
                                <option value="novela">Novela</option>
                                <option value="ciencia">Ciencia</option>
                                <option value="historia">Historia</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea id="descripcion" class="form-control" rows="3"></textarea>
                        </div>

                    </div>

                    <div class="mt-3">
                        <button type="button" class="btn btn-primary">Guardar</button>
                        <button type="button" class="btn btn-danger">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>

</html>
