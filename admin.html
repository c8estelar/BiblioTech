<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/admin.css">
    <title>Administrador Autentico</title>
</head>

<body>
    <header class="admi">
        <nav class="navbar navbar-dark">
            <div class="container">
                <div class="row w-100 align-items-center">
                    <div class="col-3">
                        <img src="img/Logotipo Bibliotech con birrete y borla.png" alt="Logo BiblioTech" height="60">
                    </div>
                    <div class="col-6 text-center">
                        <h1 class="h4 text-white mb-0">Panel de Administración</h1>
                    </div>
                    <div class="col-3 text-end">
                        <a href="login.html" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
                    </div>

                </div>
            </div>
        </nav>
    </header>
    <div class="container my-4">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Agregar o Editar libro</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" id="titulo" class="form-control" placeholder="El nombre de la rosa">
                        </div>

                        <div class="col-md-6">
                            <label for="autor" class="form-label">Autor</label>
                            <input type="text" id="autor" class="form-control" placeholder="HumbertoEco">
                        </div>

                        <div class="col-md-6">
                            <label for="portada" class="form-label">Portada (URL)</label>
                            <input type="url" id="portada" class="form-control" placeholder="https://www.suneo.mx/literatura/subidas/Umberto%20Eco%20El%20Nombre%20de%20la%20Rosa.pdf">
                        </div>

                        <div class="col-md-6">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select id="categoria" class="form-select">
                                <option value="" selected disabled>Seleccionar categoría</option>
                                <option value="novela">Novela</option>
                                <option value="ciencia">Ciencia</option>
                                <option value="historia">Historia</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea id="descripcion" class="form-control" rows="3"></textarea>
                        </div>

                    </div>

                    <div class="mt-3">
                        <button type="button" class="btn btn-biblio">Guardar</button>
                        <button type="button" class="btn btn-outline-dark">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Libros registrados</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead class="libros">
                            <tr>
                                <th>Portada</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Categoría</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><img src="img/cien-anos-de-soledad.jpg" alt="Portada" width="50"></td>
                                <td>Cien años de soledad</td>
                                <td>Gabriel García Márquez</td>
                                <td>Novela</td>
                                <td>
                                    <button type="button" class="btn btn-editar btn-sm">Editar</button>
                                    <button type="button" class="btn btn-eliminar btn-sm">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td><img src="img/91QH0SHtdOL._AC_UF1000,1000_QL80_.jpg" alt="Portada" width="50"></td>
                                <td>Breve historia del tiempo</td>
                                <td>Stephen Hawking</td>
                                <td>Ciencia</td>
                                <td>
                                    <button type="button" class="btn btn-editar btn-sm">Editar</button>
                                    <button type="button" class="btn btn-eliminar btn-sm">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td><img src="img/360_la-odisea-1.jpg" alt="Portada" width="50"></td>
                                <td>La odisea</td>
                                <td>Homero</td>
                                <td>Historia</td>
                                <td>
                                    <button type="button" class="btn btn-editar btn-sm">Editar</button>
                                    <button type="button" class="btn btn-eliminar btn-sm">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
